# =========================================================
# EBAC Shop – Quality Assurance CI Pipeline
# Projeto TCC EBAC QE
# =========================================================
# Executa testes automatizados de:
# - UI (Cucumber + Cypress)
# - API (Cucumber + Supertest)
# - Performance (k6)
#
# Relatórios:
# - UI e API: Allure
# - Performance: HTML gerado pelo k6
# - Todos publicados no GitHub Pages (gh-pages)
# =========================================================

name: EBAC Shop – Pipeline de Qualidade

permissions:
  contents: write # necessário para publicar no gh-pages

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:

  # ======================================================
  # UI TESTS - Cucumber + Cypress
  # ======================================================
    ui-tests:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Instalar dependências
        run: npm ci

      # -------------------------------
      # Cypress UI Tests (Chrome)
      # -------------------------------
      - name: Executar testes UI (Cypress + Chrome)
        run: |
          npx cypress run \
            --browser chrome \
            --headless
        env:
          BASE_URL: ${{ secrets.BASE_URL }}
          CYPRESS_USER: ${{ secrets.CYPRESS_USER }}
          CYPRESS_PASSWORD: ${{ secrets.CYPRESS_PASSWORD }}

      # -------------------------------
      # Allure UI
      # -------------------------------
      - name: Gerar relatório Allure UI
        if: always()
        run: npm run report:ui

      - name: Salvar relatório UI (Artifact)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: allure-ui-report
          path: allure/ui-tests/ui-report

      - name: Publicar relatório UI (GitHub Pages)
        if: always()
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: gh-pages
          publish_dir: allure/ui-tests/ui-report
          destination_dir: ui


  # ======================================================
  # API TESTS - Cucumber + Supertest
  # ======================================================
  api-tests:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Instalar dependências
        run: npm install

      - name: Executar testes API
        continue-on-error: true
        run: npm run test:api
        env:
          BASE_URL: ${{ secrets.BASE_URL }}
          BASIC_AUTH: ${{ secrets.BASIC_AUTH }}

      - name: Gerar relatório Allure API
        run: npm run report:api

      - name: Salvar relatório API (Artifact)
        uses: actions/upload-artifact@v4
        with:
          name: allure-api-report
          path: allure/api-tests/api-report

      - name: Publica relatório Allure de API no GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: gh-pages
          publish_dir: allure/api-tests/api-report
          destination_dir: api

  # ======================================================
  # PERFORMANCE TESTS - k6
  # ======================================================
  performance-tests:
    name: Testes de Performance – k6
    runs-on: ubuntu-latest

    steps:
      - name: Checkout do repositório
        uses: actions/checkout@v4

      # --------------------------------------------------
      # Permissão para execução dos scripts no Linux
      # --------------------------------------------------
      - name: Conceder permissão de execução aos scripts de performance
        run: chmod +x performance/*.js

      # --------------------------------------------------
      # Execução dos testes de performance
      # --------------------------------------------------
      - name: Executar todos os testes de performance (k6)
        uses: grafana/k6-action@v0.3.0
        with:
          filename: performance/run.all.js
        env:
          BASE_URL: ${{ secrets.BASE_URL }}

      # --------------------------------------------------
      # Publicação GitHub Pages – Login
      # --------------------------------------------------
      - name: Publicar relatório de performance – Login
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: gh-pages
          publish_dir: performance/reports/login
          destination_dir: performance/login

      # --------------------------------------------------
      # Publicação GitHub Pages – Produto
      # --------------------------------------------------
      - name: Publicar relatório de performance – Produto
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: gh-pages
          publish_dir: performance/reports/produto
          destination_dir: performance/produto

      # --------------------------------------------------
      # Artifacts (backup técnico)
      # --------------------------------------------------
      - name: Enviar relatório de performance – Login (Artifact)
        uses: actions/upload-artifact@v4
        with:
          name: k6-performance-login
          path: performance/reports/login

      - name: Enviar relatório de performance – Produto (Artifact)
        uses: actions/upload-artifact@v4
        with:
          name: k6-performance-produto
          path: performance/reports/produto

# =========================================================
# OBSERVAÇÕES FINAIS:
#
# - Mobile (Appium) - Não incluso no CI por está configurado para teste em aparelho físico.
# - Variáveis sensíveis são gerenciadas via GitHub Secrets.
# - A arquitetura permite fácil expansão futura.
# =========================================================
