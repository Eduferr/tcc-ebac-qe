# =========================================================
# EBAC Shop – Quality Assurance CI Pipeline
# Projeto TCC EBAC QE
# =========================================================

name: EBAC Shop – Pipeline de Qualidade

permissions:
  contents: write

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:

  # ======================================================
  # UI TESTS - Cypress + Cucumber (CI SAFE)
  # ======================================================
  ui-tests:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Instalar dependências (determinístico)
        run: npm ci

      # --------------------------------------------------
      # EXECUÇÃO CYPRESS (CHROME HEADLESS)
      # --------------------------------------------------
      - name: Executar testes UI (Cypress + Chrome)
        run: |
          npx cypress run \
            --browser chrome \
            --headless
        env:
          BASE_URL: ${{ secrets.BASE_URL }}
          CYPRESS_USER: ${{ secrets.CYPRESS_USER }}
          CYPRESS_PASSWORD: ${{ secrets.CYPRESS_PASSWORD }}

      # --------------------------------------------------
      # ALLURE UI (sempre executa)
      # --------------------------------------------------
      - name: Gerar relatório Allure UI
        if: always()
        run: npm run report:ui

      - name: Salvar relatório UI (Artifact)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: allure-ui-report
          path: allure/ui-tests/ui-report

      - name: Publicar relatório UI (GitHub Pages)
        if: always()
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: gh-pages
          publish_dir: allure/ui-tests/ui-report
          destination_dir: ui

  # ======================================================
  # API TESTS - Cucumber + Supertest
  # ======================================================
  api-tests:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - run: npm ci

      - name: Executar testes API
        run: npm run test:api
        env:
          BASE_URL: ${{ secrets.BASE_URL }}
          BASIC_AUTH: ${{ secrets.BASIC_AUTH }}

      - name: Gerar relatório Allure API
        if: always()
        run: npm run report:api

      - name: Salvar relatório API (Artifact)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: allure-api-report
          path: allure/api-tests/api-report

      - name: Publicar relatório API (GitHub Pages)
        if: always()
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: gh-pages
          publish_dir: allure/api-tests/api-report
          destination_dir: api

  # ======================================================
  # PERFORMANCE TESTS - k6
  # ======================================================
  performance-tests:
    name: Testes de Performance – k6
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Permissão scripts
        run: chmod +x performance/*.js

      - name: Executar testes k6
        uses: grafana/k6-action@v0.3.0
        with:
          filename: performance/run.all.js
        env:
          BASE_URL: ${{ secrets.BASE_URL }}

      - name: Publicar relatório – Login
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: gh-pages
          publish_dir: performance/reports/login
          destination_dir: performance/login

      - name: Publicar relatório – Produto
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: gh-pages
          publish_dir: performance/reports/produto
          destination_dir: performance/produto
